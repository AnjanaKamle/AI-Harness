[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-harness"
version = "0.1.0"
description = "Multi-agent AI coding harness (LCC x DevClub AI Harness Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.11"
# rich: terminal UI (presentation only). The provider SDK for the official evaluation model
# is added once the hackathon specifies it.
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["demo/sample/*", "demo/sample/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: optional tests that call a real LLM provider (skipped unless configured)"]
